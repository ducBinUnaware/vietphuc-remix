<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Audition Viet Phuc Remix - Community Feed</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/feed.css">
</head>
<body>
    <nav class="sidebar">
        <div class="nav-icons">
            <a href="index.html" class="logo">💃</a>
            <a href="index.html" class="nav-icon active" title="Trang chủ">🏠</a>
            <a href="page/wardrobe.html" class="nav-icon" title="Tủ đồ & AI Fitting Room">👗</a>
            <a href="page/profile.html" class="nav-icon" title="Trang cá nhân">📌</a>
        </div>
        <a href="page/login.html" class="nav-icon" title="Đăng nhập">⚙️</a>
    </nav>

    <div class="app-content">
        <header class="topbar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="Tìm kiếm trang phục, phong cách remix...">
            </div>
            <a href="page/profile.html" class="user-avatar" id="nav-user-avatar">B</a>
        </header>

        <main class="feed-container">
            <div class="masonry-grid" id="pinterest-feed">
                <div class="pin-card">
                    <div class="pin-media">
                        <img src="https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?w=400" alt="Nhật Bình Remix">
                        <div class="pin-overlay"><button class="btn-save">Lưu</button></div>
                    </div>
                    <div class="pin-info">
                        <h3>Áo Nhật Bình x Chân Váy Xếp Ly</h3>
                        <div class="pin-meta"><span class="badge-pass">AI APPROVED 9.5</span><span class="author">@AuditionStylist</span></div>
                    </div>
                </div>

                <div class="pin-card">
                    <div class="pin-media">
                        <img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?w=400" alt="Ngũ Thân Casual">
                        <div class="pin-overlay"><button class="btn-save">Lưu</button></div>
                    </div>
                    <div class="pin-info">
                        <h3>Áo Ngũ Thân Tay Chẽn Streetwear</h3>
                        <div class="pin-meta"><span class="badge-pass">AI APPROVED 9.0</span><span class="author">@GenZ_Culture</span></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
