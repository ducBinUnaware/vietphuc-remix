<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang cá nhân - Audition Viet Phuc Remix</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
    <nav class="sidebar">
        <div class="nav-icons">
            <a href="../index.html" class="logo">💃</a>
            <a href="../index.html" class="nav-icon">🏠</a>
            <a href="wardrobe.html" class="nav-icon">👗</a>
            <a href="profile.html" class="nav-icon active">📌</a>
        </div>
        <a href="login.html" class="nav-icon">⚙️</a>
    </nav>

    <div class="app-content">
        <header class="topbar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="Tìm kiếm ghim của bạn...">
            </div>
            <a href="profile.html" class="user-avatar">B</a>
        </header>

        <main class="profile-container">
            <div class="profile-header">
                <div class="avatar-large" id="profile-avatar">B</div>
                <h2 id="profile-name">Bduc</h2>
                <p class="sub-text">Chủ nhân tủ đồ Audition Viet Phuc Remix</p>
                <button class="btn-gray">Chia sẻ hồ sơ</button>
            </div>

            <div class="profile-tabs">
                <button class="tab-btn active">Bảng ý tưởng</button>
                <button class="tab-btn">Đã lưu</button>
            </div>

            <div class="empty-state">
                <div style="font-size:48px;">📌</div>
                <h3>Sắp xếp ý tưởng của bạn</h3>
                <p>Ghim là những tia cảm hứng. Bảng là nơi chúng tồn tại.</p>
                <a href="wardrobe.html" class="btn-red">+ Tạo bản phối mới</a>
            </div>
        </main>
    </div>
</body>
</html>
