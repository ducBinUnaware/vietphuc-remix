<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Audition Viet Phuc Remix</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div style="width:100%; height:100vh; display:flex; align-items:center; justify-content:center; background:#fdfdfd;">
        <div class="auth-container">
            <h2>💃 Welcome Back</h2>
            <p>Đăng nhập để lưu bản phối Việt phục</p>
            <form class="auth-form" onsubmit="handleLogin(event)">
                <label>Tên đăng nhập:</label>
                <input type="text" id="login-username" value="bduc" required>
                <label>Mật khẩu:</label>
                <input type="password" id="login-password" value="123456" required>
                <button type="submit" class="btn-auth">Đăng Nhập</button>
            </form>
        </div>
    </div>
    <script src="../js/auth.js"></script>
</body>
</html>
